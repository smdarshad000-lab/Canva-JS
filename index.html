<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geometry box</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 p-4 md:p-8">

   <div class="mx-auto w-full max-w-4xl rounded-2xl bg-white p-4 shadow-xl md:p-6">

        <h1 class="mb-1 text-2xl font-bold text-slate-800">Geometry Box</h1>

        <div class="mb-4 flex flex-wrap gap-2">
            <button id="compassBtn" class="rounded-lg border border-slate-900 bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition">
                Compass</button>
                <button id="protractorBtn" class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:bg-slate-100">
                    protractor
                </button>

                <button id="clearBtn" class="rounded-lg border border-red-200 bg-red-50 px-4 py-2 text-sm font-semibold text-red-600 transition hover:bg-red-100">
                Clear</button>                
        </div>

        <canvas id="Canvas" width="800" height="600" class="block h-auto cursor-crosshair rounded-xl border border-slate-300 bg-white">

        </canvas>
        <p id="info" class="mt-4 text-sm text-slate-600">Compass: click to set the center, then clink again to set the radius.</p>

   </div> 
    

    
    <script src="app.js"></script>

</body>
</html>
